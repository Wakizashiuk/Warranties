const S='<svg viewBox="0 0 48 48" class="ico" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';

insurance:S+'<path d="M24 4l16 6v12c0 10-7 18-16 22C15 40 8 32 8 22V10z"/><path d="M17 24l5 5 9-10"/></svg>',
other:S+'<rect x="8" y="8" width="32" height="32" rx="6"/><path d="M18 24h12M24 18v12"/></svg>'};
const TYPES=[['oven','Oven or cooker'],['freezer','Freezer'],['fridgefreezer','Fridge or fridge freezer'],['washer','Washing machine'],['dishwasher','Dishwasher'],['dryer','Tumble dryer'],['tv','TV'],['computer','Computer or laptop'],['phone','Phone or tablet'],['vacuum','Vacuum or floor care'],['smallappliance','Small appliance'],['boiler','Boiler or heating'],['car','Car (insurance, breakdown, MOT)'],['insurance','Insurance policy (home, pet, travel)'],['other','Other']];
const isPolicy=t=>t==='car'||t==='insurance';

/* ---------- fields ---------- */
const KEYS=['brand','model','serial','purchased','retailer','cover','provider','policy','expires','cost','contact','docs'];
const DATE_KEYS={purchased:1,expires:1};
const WARRANTY_LAB={brand:'Brand',model:'Model',serial:'Serial number',purchased:'Purchased',retailer:'Bought from',cover:'Cover type',provider:'Warranty provider',policy:'Policy / plan ref',expires:'Cover ends',cost:'Price paid',contact:'How to claim',docs:'Receipt / documents link'};
const POLICY_LAB={provider:'Insurer / provider',policy:'Policy number',model:'Plan or level',serial:'What it covers',cover:'Cover type',purchased:'Start date',expires:'Renews on',cost:'Premium',retailer:'Bought via',contact:'How to claim',docs:'Documents link'};
const POLICY_ORDER=['provider','policy','model','serial','cover','purchased','expires','cost','retailer','contact','docs'];
function fieldsFor(type){
  if(isPolicy(type)){const lab=Object.assign({},POLICY_LAB);if(type==='car'){lab.serial='Registration';lab.model='Vehicle';}return POLICY_ORDER.map(k=>[k,lab[k]]);}
  return KEYS.map(k=>[k,WARRANTY_LAB[k]]);
}
const COVERS=['','Manufacturer guarantee','Extended plan','Retailer warranty','Insurance policy','Breakdown cover','MOT / service','None'];
const OPTIONAL={cost:1,docs:1};

/* ---------- data model + merge ---------- */
function normalise(d){
  if(!d||typeof d!=='object')d={};
  if(Array.isArray(d.rooms)&&d.rooms.some(r=>Array.isArray(r.items))&&!Array.isArray(d.items)){ // v1 (nested)
    const t=now(),rooms=[],items=[];
    d.rooms.forEach((r,i)=>{rooms.push({id:r.id,name:r.name,order:i,updatedAt:t});(r.items||[]).forEach(it=>items.push(Object.assign({},it,{room:r.id,updatedAt:t})));});
    d={version:2,rooms,items,deleted:{}};
  }
  d.version=2;d.rooms=Array.isArray(d.rooms)?d.rooms:[];d.items=Array.isArray(d.items)?d.items:[];d.files=Array.isArray(d.files)?d.files:[];d.files.forEach(f=>{if(!f.updatedAt)f.updatedAt=0;});d.deleted=d.deleted&&typeof d.deleted==='object'?d.deleted:{};
  d.items.forEach(it=>{KEYS.forEach(k=>{if(it[k]==null)it[k]='';});if(it.notes==null)it.notes='';if(!it.type)it.type='other';if(!it.updatedAt)it.updatedAt=0;});
  d.rooms.forEach((r,i)=>{if(r.order==null)r.order=i;if(!r.updatedAt)r.updatedAt=0;});
  return d;
}
function merge(a,b){
  a=normalise(JSON.parse(JSON.stringify(a)));b=normalise(JSON.parse(JSON.stringify(b)));
  const del=Object.assign({},a.deleted);
  Object.keys(b.deleted).forEach(k=>{del[k]=Math.max(del[k]||0,b.deleted[k]);});
  const pick=(la,lb)=>{const m=new Map();la.concat(lb).forEach(x=>{const o=m.get(x.id);if(!o||(x.updatedAt||0)>(o.updatedAt||0))m.set(x.id,x);});return[...m.values()].filter(x=>!(del[x.id]&&del[x.id]>=(x.updatedAt||0)));};
  const rooms=pick(a.rooms,b.rooms).sort((x,y)=>(x.order-y.order)||String(x.name).localeCompare(y.name));
  const items=pick(a.items,b.items);
  const files=pick(a.files,b.files).sort((x,y)=>(x.addedAt||0)-(y.addedAt||0));
  return{version:2,rooms,items,files,deleted:del};
}
function canon(d){const n=normalise(JSON.parse(JSON.stringify(d)));return JSON.stringify({rooms:n.rooms.slice().sort((x,y)=>x.id<y.id?-1:1),items:n.items.slice().sort((x,y)=>x.id<y.id?-1:1),files:n.files.slice().sort((x,y)=>x.id<y.id?-1:1),deleted:Object.keys(n.deleted).sort().map(k=>[k,n.deleted[k]])});}

/* ---------- GitHub sync ---------- */
function b64enc(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);}

function gh(url,opts){
  opts=opts||{};
  return fetch(url,{method:opts.method||'GET',cache:'no-store',headers:Object.assign({'Authorization':'Bearer '+cfg.token,'Accept':opts.accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},opts.body?{'Content-Type':'application/json'}:{}),body:opts.body?JSON.stringify(opts.body):undefined});
}
const repoUrl=()=>'https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo);
const fileUrl=()=>repoUrl()+'/contents/'+cfg.path.split('/').map(encodeURIComponent).join('/');
function persist(){LS.set('data',state);LS.set('dirty',dirty);}
async function doSync(opts){
  opts=opts||{};
  if(!cfg.token||sync.busy)return;
  if(!navigator.onLine){sync.err='';renderBg();return;}
  sync.busy=true;sync.err='';renderBg();
  try{
    for(let attempt=0;attempt<3;attempt++){
      const r=await gh(fileUrl());
      let remote=null,sha=null;
      if(r.status===404){
        const rr=await gh(repoUrl());
        if(rr.status===404||rr.status===403)throw new Error('Can’t see the repo '+cfg.owner+'/'+cfg.repo+'. Check the name, and that the token has access to it.');
        if(!opts.create){sync.missing=true;break;}

      else if(!r.ok){throw new Error('GitHub error '+r.status+'. Try again shortly.');}

        const body={message:'Update warranties'+(cfg.device?' ('+cfg.device+')':''),content:b64enc(JSON.stringify(Object.assign({updated:new Date().toISOString()},merged),null,1))};
        if(sha)body.sha=sha;

        if(p.status===409||p.status===422){continue;}
        if(p.status===403||p.status===404)throw new Error('The token can read but not save. Give it “Contents: Read and write” access.');

const MAX_PDF=15*1024*1024, TARGET=500*1024;
let upload={item:null,text:''};

function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(blob);});}
async function shrink(file){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('That picture format can’t be read. Try a JPEG or a screenshot.'));i.src=URL.createObjectURL(file);});}
  const w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight;
  let max=2000,q=0.8,blob=null;
  for(let i=0;i<8;i++){
    const sc=Math.min(1,max/Math.max(w0,h0)),w=Math.round(w0*sc),h=Math.round(h0*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(src,0,0,w,h);
    blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
    if(blob&&blob.size<=TARGET)break;
    if(q>0.55)q-=0.1;else max=Math.round(max*0.8);
  }
  if(src.close)src.close();
  return blob;
}
function niceName(file,camera,n){

async function uploadDocs(itemId,files,camera){
  if(!needOnline('Adding documents'))return;
  const it=state.items.find(i=>i.id===itemId);if(!it)return;
  let done=0;const added=[];
  try{
    for(const file of files){
      const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name||'');
      const isImg=!isPdf&&(/^image\//.test(file.type)||/\.(jpe?g|png|heic|heif|webp|gif)$/i.test(file.name||''));
      if(!isPdf&&!isImg)throw new Error('“'+file.name+'” isn’t a photo or PDF.');
      if(isPdf&&file.size>MAX_PDF)throw new Error('“'+file.name+'” is over 15 MB. Try a smaller PDF.');
      upload={item:itemId,text:(isImg?'Shrinking and uploading ':'Uploading ')+(files.length>1?(done+1)+' of '+files.length:'')+'…'};render();
      const blob=isImg?await shrink(file):file;
      const id=uid('doc'),ext=isImg?'jpg':'pdf',path='files/'+itemId+'/'+id+'.'+ext;
      const r=await gh(pathUrl(path),{method:'PUT',body:{message:'Add document to '+it.name+(cfg.device?' ('+cfg.device+')':''),content:await blobToB64(blob)}});
      if(r.status===401)throw new Error('GitHub didn’t accept the access token.');
      if(!r.ok)throw new Error('Couldn’t upload to GitHub ('+r.status+').');

  if(added.length)commit(s=>{s.files.push(...added);},added.length===1?'Document added.':added.length+' documents added.');
  else render();
}

const safeName=n=>String(n||'Document').replace(/[\\/:*?"<>|]+/g,'-').trim()||'Document';
function openViewer(id){
  const f=state.files.find(x=>x.id===id);if(!f)return;
  vstate={id,confirm:false,zoom:1,pdf:null,gen:vstate.gen+1};
  const it=state.items.find(i=>i.id===f.item)||{};
  viewer.hidden=false;document.body.style.overflow='hidden';
  viewer.innerHTML='<div class="vbar"><b id="vtitle">'+esc(f.name)+'</b>'+
    (f.kind==='pdf'?'<span class="vzoom"><button class="ghost small" data-vzoom="-1" aria-label="Zoom out">−</button><button class="ghost small" data-vzoom="1" aria-label="Zoom in">+</button></span>':'')+
    '<a class="ghost small vbtn" id="vdl" hidden>Download</a><button class="ghost small" data-vclose>Close</button></div>'+
    '<div class="vbody'+(f.kind==='pdf'?' vpdf':'')+'" id="vbody"><p>Loading…</p></div>'+
    '<form class="vfoot" data-vrename id="vfoot"></form>'+
    '<p style="margin:0 12px 10px;font-size:12px;color:#9aa8b8">'+esc(it.name||'')+(f.addedAt?' · added '+new Date(f.addedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'')+(f.by?' by '+esc(f.by):'')+'</p>';
  drawFoot();loadViewer(f);
}
function drawFoot(){
  const f=state.files.find(x=>x.id===vstate.id),el=document.getElementById('vfoot');if(!f||!el)return;
  el.innerHTML='<label>Name<input name="name" value="'+esc(f.name)+'" maxlength="80"></label><button type="submit" class="ghost small">Rename</button>'+(vstate.confirm?'<button type="button" class="danger small" data-vdel>Confirm delete</button>':'<button type="button" class="ghost small" data-vask>Delete</button>');
}
function setBody(h){const b=document.getElementById('vbody');if(b)b.innerHTML=h;}
function closeViewer(){if(vstate.pdf){try{vstate.pdf.destroy();}catch(e){}}vstate={id:null,confirm:false,zoom:1,pdf:null,gen:vstate.gen+1};viewer.hidden=true;viewer.innerHTML='';document.body.style.overflow='';}
async function loadViewer(f){
  const gen=vstate.gen;
  if(!navigator.onLine){setBody('<p>Documents need an internet connection to open. Your text details still work offline.</p>');return;}
  try{
    const url=await fetchDoc(f);if(vstate.gen!==gen)return;
    const dl=document.getElementById('vdl');if(dl){dl.href=url;dl.download=safeName(f.name)+'.'+fileExt(f);dl.hidden=false;}
    if(f.kind==='image'){setBody('<img src="'+url+'" alt="'+esc(f.name)+'">');return;}
    if(!pdfLib){pdfLib=await import('./pdfjs/pdf.min.js');pdfLib.GlobalWorkerOptions.workerSrc=new URL('./pdfjs/pdf.worker.min.js',location.href).href;}
    const data=new Uint8Array(await (await fetch(url)).arrayBuffer());
    const pdf=await pdfLib.getDocument({data,isEvalSupported:false}).promise;
    if(vstate.gen!==gen){pdf.destroy();return;}
    vstate.pdf=pdf;await renderPdf(gen);
  }catch(e){if(vstate.gen===gen)setBody('<p>'+esc((e&&e.message)||'Couldn’t open it.')+'</p><p>You can still use Download to open it in another app.</p>');}
}
async function renderPdf(gen){
  const pdf=vstate.pdf,body=document.getElementById('vbody');if(!pdf||!body)return;
  const holder=document.createElement('div');holder.className='pdfpages';holder.id='pdfpages';
  const fitW=Math.min(body.clientWidth-16,900),cssW=Math.round(fitW*vstate.zoom),dpr=Math.min(window.devicePixelRatio||1,2);
  body.innerHTML='';body.appendChild(holder);
  const pages=Math.min(pdf.numPages,40);
  for(let n=1;n<=pages;n++){
    if(vstate.gen!==gen)return;
    const page=await pdf.getPage(n),base=page.getViewport({scale:1}),sc=cssW/base.width,vp=page.getViewport({scale:sc*dpr});
    const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.width=cssW+'px';c.style.height=Math.round(base.height*sc)+'px';c.setAttribute('aria-label','Page '+n);
    holder.appendChild(c);
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  }
  if(pdf.numPages>pages){const p=document.createElement('p');p.textContent='Showing the first '+pages+' of '+pdf.numPages+' pages. Use Download to see the rest.';holder.appendChild(p);}
}
viewer.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if('vclose' in d){closeViewer();return;}
  if(d.vzoom){const z=[0.75,1,1.5,2,3],i=z.indexOf(vstate.zoom),ni=Math.max(0,Math.min(z.length-1,i+Number(d.vzoom)));if(z[ni]!==vstate.zoom){vstate.zoom=z[ni];vstate.gen++;renderPdf(vstate.gen);}return;}
  if('vask' in d){vstate.confirm=true;drawFoot();return;}
  if('vdel' in d){
    if(!needOnline('Deleting documents')){closeViewer();return;}
    const f=state.files.find(x=>x.id===vstate.id);closeViewer();if(!f)return;
    removeRemote(f);commit(s=>{s.files=s.files.filter(x=>x.id!==f.id);s.deleted[f.id]=now();},'Document deleted.');
  }
});
viewer.addEventListener('submit',e=>{
  e.preventDefault();const v=readForm(e.target);const id=vstate.id;const name=(v.name||'').trim();if(!name)return;
  commit(s=>{const f=s.files.find(x=>x.id===id);if(f){f.name=name;f.updatedAt=now();}},'Document renamed.');
  const f=state.files.find(x=>x.id===id),t=document.getElementById('vtitle'),dl=document.getElementById('vdl');
  if(t)t.textContent=name;if(dl&&f)dl.download=safeName(name)+'.'+fileExt(f);vstate.confirm=false;drawFoot();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!viewer.hidden)closeViewer();});

/* ---------- events ---------- */
function readForm(f){const fd=new FormData(f),o={};for(const[k,v]of fd.entries())o[k]=String(v).trim();return o;}
root.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.getAttribute('type')==='submit')return;
  const d=t.dataset;
  const reset=()=>{ui.editing=ui.draft=ui.confirmDel=null;ui.adding=ui.addingRoom=ui.renaming=false;msg='';};
  if(d.tab){reset();ui.room=d.tab;LS.set('tab',d.tab);render();window.scrollTo(0,0);return;}
  if(d.goto){reset();ui.room=d.goto;LS.set('tab',d.goto);render();window.scrollTo(0,0);return;}
  if('settings' in d){reset();ui.settings=!ui.settings;render();return;}
  if('addroom' in d){reset();ui.addingRoom=true;render();root.querySelector('[data-roomform] input').focus();return;}
  if(d.edit){reset();ui.editing=d.edit;render();return;}
  if('additembtn' in d){reset();ui.adding=true;render();root.querySelector('[data-additem] input').focus();return;}
  if('rename' in d){reset();ui.renaming=true;render();return;}
  if('cancel' in d){reset();ui.settings=false;render();return;}
  if(d.askdel){ui.confirmDel=d.askdel;render();return;}
  if(d.delitem){const id=d.delitem;const gone=docsOf(id);commit(s=>{const t=now();s.items=s.items.filter(i=>i.id!==id);s.deleted[id]=t;s.files.filter(f=>f.item===id).forEach(f=>{s.deleted[f.id]=t;});s.files=s.files.filter(f=>f.item!==id);},'Item removed.');gone.forEach(removeRemote);return;}
  if('delroom' in d){const rid=ui.room;const ids=new Set(itemsIn(rid).map(i=>i.id));const gone=state.files.filter(f=>ids.has(f.item));gone.forEach(removeRemote);commit(s=>{const t=now();s.files.filter(f=>ids.has(f.item)).forEach(f=>{s.deleted[f.id]=t;});s.files=s.files.filter(f=>!ids.has(f.item));s.items.filter(i=>i.room===rid).forEach(i=>{s.deleted[i.id]=t;});s.items=s.items.filter(i=>i.room!==rid);s.rooms=s.rooms.filter(r=>r.id!==rid);s.deleted[rid]=t;},'Tab deleted.');ui.room='__overview';render();return;}
  if(d.camdoc){pickDocs(d.camdoc,true);return;}
  if(d.adddoc){pickDocs(d.adddoc,false);return;}
  if(d.viewdoc){openViewer(d.viewdoc);return;}
  if('syncnow' in d){doSync();return;}
  if('create' in d){doSync({create:true});return;}
  if('export' in d){exportData();return;}
  if('import' in d){fileInput.click();return;}
  if('disconnect' in d){['cfg','data','dirty','lastSync','tab'].forEach(LS.del);docCache.forEach(u=>URL.revokeObjectURL(u));docCache.clear();cfg=Object.assign({},DEFAULT_CFG);state=normalise({});dirty=false;lastSync=null;sync={busy:false,err:'',missing:false};ui.settings=false;ui.confirmDel=null;ui.room='__overview';render();return;}
});
root.addEventListener('change',e=>{
  if(e.target.matches('[data-retype]')){const f=e.target.form,it=state.items.find(i=>i.id===f.dataset.form);ui.draft=Object.assign({},it,readForm(f));render();}
});
root.addEventListener('input',e=>{if(e.target.matches('[data-search]')){ui.q=e.target.value;results();}});
root.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target,v=readForm(f);
  if(f.dataset.form){const id=f.dataset.form;commit(s=>{const it=s.items.find(i=>i.id===id);if(!it)return;it.name=v.name||it.name;it.type=v.type||it.type;if(v.room)it.room=v.room;KEYS.forEach(k=>{if(k in v)it[k]=v[k];});it.notes=v.notes||'';it.updatedAt=now();},'Saved.');return;}
  if('additem' in f.dataset){const id=uid(v.name);const rid=ui.room;commit(s=>{const it={id,room:rid,name:v.name,type:v.type||'other',notes:'',updatedAt:now()};KEYS.forEach(k=>it[k]='');s.items.push(it);});ui.editing=id;render();return;}
  if('roomform' in f.dataset){const id=uid(v.name);commit(s=>{s.rooms.push({id,name:v.name,order:Math.max(-1,...s.rooms.map(r=>r.order))+1,updatedAt:now()});},'Tab added.');ui.room=id;LS.set('tab',id);render();return;}
  if('renameform' in f.dataset){const rid=ui.room;commit(s=>{const r=s.rooms.find(x=>x.id===rid);if(r){r.name=v.name||r.name;r.updatedAt=now();}},'Tab renamed.');return;}
  if('setup' in f.dataset){
    const first=!cfg.token;
    cfg.owner=v.owner;cfg.repo=v.repo;cfg.device=v.device||'';if(v.token)cfg.token=v.token;
    LS.set('cfg',cfg);ui.settings=false;msg=first?'Connected. Fetching your list…':'Settings saved.';render();doSync();return;
  }
});
window.addEventListener('online',()=>{renderBg();doSync();});
window.addEventListener('offline',renderBg);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')doSync();});
setInterval(()=>{if(!sync.busy)renderBg();},60000);

try{state=normalise(LS.get('data',null)||{version:2,rooms:[],items:[],deleted:{}});render();}catch(e){window.__hwErr(e&&e.message||String(e));}
doSync();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
})();
</script>
